name: onfoot_app
description: Aplicativo OnFoot
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.5

  app_links: ^3.5.1
  cupertino_icons: ^1.0.8
  mapbox_maps_flutter: ^2.12.0
  geolocator: ^12.0.0
  http: ^1.2.0
  supabase_flutter: ^2.5.0 
  url_launcher: ^6.2.0  # Necessário para deep links
  image_picker: ^1.1.2   # ✔ ADICIONADO
  sliding_up_panel: ^2.0.0+1
  wakelock_plus: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#E8D6A3"
  image: assets/splash/splash.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: scaleAspectFit

flutter:
  uses-material-design: true

  assets:
    - assets/splash/splash.png
    - assets/icon/icon.png
    - assets/profile/default_avatar.png
    - assets/footprint.png
    - assets/footprints/foot_left.png
    - assets/footprints/foot_right.png
